services:
  rabbitmq:
    image: rabbitmq:4.3.0-management
    restart: unless-stopped
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: user  
      RABBITMQ_DEFAULT_PASS: "Jksy2828!!"

  mongodb:
    image: "mongodb/mongodb-community-server:8.2.9-ubuntu2204-slim"
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: "Jksy2828!!"
    volumes:
      - mongodb_data:/data/db

  rabbitmq-consumer:
    image: python:3.11.15-slim
    working_dir: /app
    volumes:
      - ./rabbitmq_consumer/.:/app
    environment:
      RABBITMQ_DEFAULT_USER: user  
      RABBITMQ_DEFAULT_PASS: "Jksy2828!!"
    # sh -c는 문자열로 준 명령어를 shell에서 실행하라는 뜻
    command: sh -c "pip install -r requirements.txt && python consumer.py" 
    restart: unless-stopped
    depends_on:
      - rabbitmq

volumes:
  mongodb_data: